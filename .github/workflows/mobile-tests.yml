name: Mobile Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [android-real, ios-real, browserstack-android]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install dependencies
      run: npm ci
      
    - name: Start Android Emulator
      if: matrix.project == 'android-real'
      run: |
        sdkmanager "system-images;android-30;google_apis;x86_64"
        avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64"
        emulator -avd test -no-snapshot-load &
        sleep 30
        
    - name: Run Tests
      env:
        BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
        BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: npx playwright test --project=${{ matrix.project }} --reporter=allure-playwright
      
    - name: Generate Allure Report
      if: always()
      run: npx allure generate allure-results --clean && npx allure upload allure-report
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ matrix.project }}
        path: allure-report