version: '3.8'

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.41.0-jammy
    # Or build your own with Dockerfile:
    # build: .
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - ./tests:/tests
      - ./playwright.config.js:/tests/playwright.config.js
      - ./test-results:/tests/test-results
      - ./screenshots:/tests/screenshots
      - ./videos:/tests/videos
    environment:
      - PLAYWRIGHT_TEST_BASE_URL=http://localhost:3000
      - CI=true
      - DEBUG=pw:api
    ports:
      - "9323:9323"  # Playwright Inspector
      - "3000:3000"  # Your app (if running locally)
    command: >
      sh -c "
        npx playwright install --with-deps &&
        npx playwright test --headed --project=chromium --grep '@mobile'
      "
    restart: unless-stopped

  app:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  test-results:
  screenshots:
  videos: